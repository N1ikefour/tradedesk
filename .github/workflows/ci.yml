name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токен в джобах не используется — least privilege.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия не дублируется здесь строкой: и CI, и `make ci-target`, и apps/api/Dockerfile
      # берут её из .python-version. Расхождение этих чисел — тот класс багов, ради
      # которого заведена ci-target (X-01); совпадение проверяет test_python_version.py.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/collector-mt5/pyproject.toml

      # MetaTrader5 не ставится: он объявлен extra с маркером sys_platform == 'win32'.
      # pre-commit приходит из apps/api[dev] — граница версии живёт только в pyproject.
      - name: install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
          pip install -e "apps/collector-mt5[dev]"

      # Ровно та же цель, что гоняется локально: make ci = ci-api + ci-web.
      - run: make ci-api

  web:
    name: web — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vite 8 требует node ^20.19 || >=22.12; 22 — то же, что на машине разработки.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install deps
        run: npm ci
        working-directory: apps/web

      - run: make ci-web
