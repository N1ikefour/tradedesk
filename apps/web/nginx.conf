# Раздача собранного SPA. /api сюда не приходит: его caddy отправляет прямо в api:8000,
# поэтому X-Forwarded-For проходит через одно звено, а не через два.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ассеты vite содержат хэш в имени — их можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаёт index.html, маршрутизацию делает роутер в браузере.
    # index.html не кэшируется, иначе после деплоя браузер тянет старые ссылки на ассеты.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
