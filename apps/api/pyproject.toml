[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedesk-api"
version = "0.1.0"
description = "TradeDesk API"
requires-python = ">=3.12"
# Только то, что реально используется кодом. Набор ограничен SPEC.md 2.3;
# boto3, pandas, python-multipart придут со своими задачами.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  # 1.16 — там появился path_separator, который стоит в alembic.ini.
  "alembic>=1.16,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  # arq тянет redis<6 (`redis[hiredis]>=4.2,<6`), и резолвер откатывает redis 6.x
  # на 5.x — верхняя граница здесь оставлена как есть, чтобы это решал он, а не мы.
  "redis>=5.0,<7.0",
  # X-25: планировщик фоновых задач (SPEC.md §10), точка входа — app/worker.py.
  "arq>=0.28,<1.0",
  "structlog>=24.1,<26.0",
  "sentry-sdk>=2.10,<3.0",
  # S0-05: AES-256-GCM для envelope-шифрования credentials (SPEC.md 2.3, 3.2).
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1.0",
  # 4.15 — раньше не было пакета testcontainers.community.*, из которого
  # интеграционные тесты берут PostgresContainer и RedisContainer.
  "testcontainers>=4.15,<5.0",
  # Метасхема draft-07 для опубликованного ingest-deals.schema.json (S1-01).
  # Только dev: файл читают потребители вне Python, а рантайм валидирует тела
  # запросов pydantic'ом — валидатор JSON Schema самому приложению не нужен.
  "jsonschema>=4.23,<5",
  # Граница версии живёт здесь одна: Makefile и CI ставят pre-commit этим extra.
  "pre-commit>=3.5,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 форматирует python-блоки внутри markdown. Здесь это страхует прогоны
# внутри каталога приложения; документы в корне репозитория защищает только
# types_or: [python, pyi] в .pre-commit-config.yaml — сюда ruff за конфигом не ходит.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Весь текст в проекте русский, а RUF001-003 считают подозрительным слово целиком из
# букв с латинскими двойниками («Ресурс», «с»). В api это шум: SPEC.md 5.1 требует русские
# сообщения об ошибках прямо в коде, и такие слова будут в каждом домене.
# В коллекторе RUF001 был включён по той же причине (он разбирает символы брокера), но
# снят в S1-08: на 31 срабатывание там не пришлось ни одного символьного литерала — все
# были русскими словами. Гомоглиф в символьных константах караулит адресный тест
# tests/test_symbol_literals.py, и он точнее правила, дающего 31 ложную тревогу.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Шаблон миграции alembic генерируется по mako и живёт по своим правилам.
"alembic/versions/*.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "alembic", "scripts"]
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Пакеты без аннотаций перечисляются поимённо: глобальный ignore_missing_imports
# прячет и настоящие опечатки в импортах. jsonschema типов не поставляет; стабы
# (types-jsonschema) — это ещё один пакет ради двух вызовов в одном тесте, поэтому
# он здесь в том же ряду, что и testcontainers.
[[tool.mypy.overrides]]
module = ["testcontainers.*", "jsonschema.*"]
ignore_missing_imports = true

# SPEC.md 2.2: strict только для domains/ingest и domains/analytics.
# `strict = true` в per-module секции mypy молча применяет к проекту целиком,
# поэтому набор флагов перечислен явно. warn_redundant_casts и warn_unused_configs
# mypy принимает только глобально: первый включён выше, второй не используем.
[[tool.mypy.overrides]]
module = ["app.domains.ingest.*", "app.domains.analytics.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: требует Docker (testcontainers). Исключается через -m 'not integration'",
]
