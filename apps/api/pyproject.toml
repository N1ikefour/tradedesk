[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedesk-api"
version = "0.1.0"
description = "TradeDesk API"
requires-python = ">=3.12"
dependencies = []

# Рантайм-зависимости (fastapi, sqlalchemy, alembic, ...) объявляет задача,
# которая их первой использует, из списка SPEC.md 2.3. См. docs/tickets/S0-01.md.
[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 форматирует python-блоки внутри markdown — документация не его дело.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Комментарии и docstring'и в проекте на русском — RUF001-003 (ambiguous unicode) шумят на кириллице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

# SPEC.md 2.2: strict для domains/ingest и domains/analytics, остальное — обычный mypy.
# Модулей ещё нет, конфиг заведён заранее, чтобы strict не пришлось «включать потом».
[[tool.mypy.overrides]]
module = ["app.domains.ingest.*", "app.domains.analytics.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
