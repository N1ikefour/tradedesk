[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedesk-api"
version = "0.1.0"
description = "TradeDesk API"
requires-python = ">=3.12"
# Только то, что реально используется кодом. Набор ограничен SPEC.md 2.3;
# arq, boto3, cryptography, pandas, python-multipart придут со своими задачами.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "redis>=5.0,<7.0",
  "structlog>=24.1,<26.0",
  "sentry-sdk>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.27,<1.0",
  "testcontainers>=4.8,<5.0",
  # Граница версии живёт здесь одна: Makefile и CI ставят pre-commit этим extra.
  "pre-commit>=3.5,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 форматирует python-блоки внутри markdown. Здесь это страхует прогоны
# внутри каталога приложения; документы в корне репозитория защищает только
# types_or: [python, pyi] в .pre-commit-config.yaml — сюда ruff за конфигом не ходит.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Комментарии и docstring'и в проекте на русском: RUF002/RUF003 шумят на них постоянно.
# RUF001 (строковые литералы) включён: гомоглиф в тикере или коде ошибки — баг данных.
# RUF001 отключён с S0-02: SPEC.md 5.1 требует русские сообщения об ошибках прямо в коде,
# а ruff считает подозрительным любое слово целиком из букв с латинскими двойниками
# («Ресурс», «с»). Гомоглифы в данных брокера ловятся нормализацией символов (S1-07),
# а не линтером исходников.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Шаблон миграции alembic генерируется по mako и живёт по своим правилам.
"alembic/versions/*.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests", "alembic"]
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true

# Пакеты без аннотаций перечисляются поимённо: глобальный ignore_missing_imports
# прячет и настоящие опечатки в импортах.
[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# SPEC.md 2.2: strict только для domains/ingest и domains/analytics.
# `strict = true` в per-module секции mypy молча применяет к проекту целиком,
# поэтому набор флагов перечислен явно. warn_redundant_casts и warn_unused_configs
# mypy принимает только глобально: первый включён выше, второй не используем.
[[tool.mypy.overrides]]
module = ["app.domains.ingest.*", "app.domains.analytics.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: требует Docker (testcontainers). Исключается через -m 'not integration'",
]
