[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedesk-collector-mt5"
version = "0.1.0"
description = "TradeDesk MT5 collector (Windows only)"
requires-python = ">=3.12"
dependencies = []

# MetaTrader5 ставится только на Windows — на Linux-раннере CI пакета нет.
# Маркер + extra: `pip install -e .[mt5]` на Windows, обычная установка везде.
[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 форматирует python-блоки внутри markdown — документация не его дело.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Комментарии и docstring'и в проекте на русском — RUF001-003 (ambiguous unicode) шумят на кириллице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["collector"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
