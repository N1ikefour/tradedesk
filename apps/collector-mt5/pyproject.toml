[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradedesk-collector-mt5"
version = "0.1.0"
description = "TradeDesk MT5 collector (Windows only)"
requires-python = ">=3.12"
# Ровно перечень SPEC.md 2.3 для collector-mt5, минус MetaTrader5: он ставится
# отдельным extra, потому что на Linux-раннере CI такого пакета нет вовсе.
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "structlog>=24.1,<26.0",
  "tenacity>=8.2,<10.0",
]

# MetaTrader5 ставится только на Windows — на Linux-раннере CI пакета нет.
# Маркер + extra: `pip install -e .[mt5]` на Windows, обычная установка везде.
[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  # Терминала на машине разработки нет, поэтому проверяемая часть коллектора — это
  # чистые функции и цикл на подделках. Без pytest от них не остаётся ничего.
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 форматирует python-блоки внутри markdown. Здесь это страхует прогоны
# внутри каталога приложения; документы в корне репозитория защищает только
# types_or: [python, pyi] в .pre-commit-config.yaml — сюда ruff за конфигом не ходит.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Комментарии и docstring'и в проекте на русском: RUF002/RUF003 шумят на них постоянно.
#
# ⚠️ RUF001 выключен в S1-08, и это отмена прежнего решения. Прежний довод — «коллектор
# разбирает символы брокера, и гомоглиф в тикере это баг данных» — не подтвердился кодом:
# символьных литералов в коллекторе ровно два (`TIME_PROBE_SYMBOLS` и `USD`), а строковых
# литералов с русским текстом — десятки, потому что SPEC.md 8.2 требует человекочитаемых
# сообщений об ошибках MT5. RUF001 срабатывал 31 раз, и все 31 — на словах вроде «Не»,
# «его», «В», целиком составленных из букв с латинскими двойниками; ни одного попадания
# в тикер. Правило шумело там, где охранять нечего, и молчало бы там, где надо.
# Замена сильнее линтера и не зависит от эвристики: `test_symbol_constants_are_ascii`
# проверяет сами константы, а не форму исходника.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
# `tests` здесь намеренно: `make ci` не гоняет тесты коллектора (цели `test-collector`
# в Makefile нет), и `lint-collector` — единственная проверка, которая до них доходит.
# Пусть она хотя бы читает их типы.
files = ["collector", "tests"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
